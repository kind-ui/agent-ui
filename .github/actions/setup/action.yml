name: Setup
description: Node from .nvmrc, the npm version in packageManager, and `npm ci`.
inputs:
  install:
    description: Run `npm ci`.
    default: "true"
  registry-url:
    description: Registry for publishing, passed to setup-node.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        check-latest: true
        cache: npm
        registry-url: ${{ inputs.registry-url }}
    - shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"
    - if: inputs.install == 'true'
      shell: bash
      run: npm ci

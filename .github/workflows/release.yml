name: Release

on:
  push:
    branches: [main]
    paths: [packages/agent-ui/package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in packages/agent-ui/package.json
        required: true
      dist-tag:
        description: npm dist-tag
        required: true
        default: latest

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    if: github.repository == 'kind-ui/agent-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          manifest=packages/agent-ui/package.json
          version=$(node -p "require('./$manifest').version")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The push that adds the package has no previous manifest, so no previous version.
            previous=
            if git cat-file -e "HEAD^:$manifest" 2>/dev/null; then
              previous=$(git show "HEAD^:$manifest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            fi
            if [ "$previous" = "$version" ]; then
              echo "::notice::$manifest changed without a version change; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "::error::$manifest is at $version, not $EXPECTED_VERSION."
            exit 1
          fi
          if [ "$(node -p "require('./$manifest').private === true")" = true ]; then
            echo "::notice::@kind-ui/agent-ui is private; publishing needs a maintainer to authorize making it public."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx "## $version" packages/agent-ui/CHANGELOG.md; then
            echo "::error::packages/agent-ui/CHANGELOG.md has no '## $version' entry; release from a Changesets version PR."
            exit 1
          fi
          case "$version" in *-*) default_tag=next ;; *) default_tag=latest ;; esac
          {
            echo "release=true"
            echo "version=$version"
            echo "dist-tag=${DIST_TAG:-$default_tag}"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run audit
      # The shared @kind-ui namespace is served from kindui.dev; skipped until that hosting is approved.
      - if: vars.KINDUI_HOSTING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-registry-namespace.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            artifacts/package/*.tgz
            artifacts/package/manifest.json
          if-no-files-found: error

  verify:
    name: Verify
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tarball: ${{ steps.verify.outputs.tarball }}
      integrity: ${{ steps.verify.outputs.integrity }}
      published: ${{ steps.verify.outputs.published }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - id: verify
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tarball=$(node -p "require('path').basename(require('./manifest.json').tarball)")
          expected=$(node -p "require('./manifest.json').sha256")
          sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
          [ "$sha256" = "$expected" ] || { echo "::error::$tarball is $sha256, but validate packed $expected."; exit 1; }
          packed=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          [ "$packed" = "$VERSION" ] || { echo "::error::$tarball is version $packed, not $VERSION."; exit 1; }
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          live=$(npm view "@kind-ui/agent-ui@$VERSION" dist.integrity 2>/dev/null || true)
          if [ -z "$live" ]; then
            published=false
          elif [ "$live" = "$integrity" ]; then
            published=true
            echo "::notice::@kind-ui/agent-ui@$VERSION is already on npm with this tarball."
          else
            echo "::error::@kind-ui/agent-ui@$VERSION is already on npm with integrity $live, not $integrity."
            exit 1
          fi
          {
            echo "tarball=$tarball"
            echo "integrity=$integrity"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "$tarball $VERSION sha256:$sha256 $integrity" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [plan, verify]
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needs a maintainer's approval; npm trusted publishing trusts this workflow and environment.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts/package
      - env:
          TARBALL: artifacts/package/${{ needs.verify.outputs.tarball }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIST_TAG: ${{ needs.plan.outputs.dist-tag }}
          # npm tries OIDC trusted publishing first and falls back to this token. A trusted publisher
          # can only be set up once the package exists, so the first publish needs the token; once the
          # secret is deleted, publishing uses OIDC alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          [ "$integrity" = "$INTEGRITY" ] || { echo "::error::$TARBALL changed after verify."; exit 1; }
          npm publish "$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"
          # npm can take minutes to show a new version, so wait while it reports none, up to 10 minutes.
          delay=5
          SECONDS=0
          while :; do
            live=$(npm view "@kind-ui/agent-ui@$VERSION" dist.integrity 2>/dev/null || true)
            [ "$live" = "$INTEGRITY" ] && exit 0
            if [ -n "$live" ]; then
              echo "::error::npm reports integrity '$live' for @kind-ui/agent-ui@$VERSION, not $INTEGRITY."
              exit 1
            fi
            if [ "$SECONDS" -ge 600 ]; then
              echo "::error::npm still doesn't show @kind-ui/agent-ui@$VERSION after ${SECONDS}s."
              exit 1
            fi
            echo "::notice::npm doesn't show @kind-ui/agent-ui@$VERSION yet; checking again in ${delay}s."
            sleep "$delay"
            delay=$(( delay * 2 > 60 ? 60 : delay * 2 ))
          done

  github-release:
    name: GitHub release
    needs: [plan, verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.verify.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: artifacts/package
      # The site handoff feeds the kindui.dev deployment; skipped until that hosting is approved.
      # It is attached when the release is created, so a release never lacks it while hosting is on.
      - if: vars.KINDUI_HOSTING == 'true'
        uses: ./.github/actions/setup
      - if: vars.KINDUI_HOSTING == 'true'
        env:
          NEXT_PUBLIC_DOCS_ORIGIN: https://kindui.dev
          NEXT_PUBLIC_DOCS_BASE_PATH: /agent-ui
        run: |
          npm run build:docs
          npm run build:registry
          node scripts/pack-site.mjs
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          gh release view "v$VERSION" > /dev/null 2>&1 && exit 0
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            packages/agent-ui/CHANGELOG.md > notes.md
          # shellcheck disable=SC2016 # The backticks are Markdown.
          printf '\n`%s`\n\n- SHA-256: `%s`\n- Integrity: `%s`\n' \
            "$TARBALL" "$(sha256sum "artifacts/package/$TARBALL" | cut -d' ' -f1)" "$INTEGRITY" >> notes.md
          shopt -s nullglob
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md \
            artifacts/site/agent-ui-site-*

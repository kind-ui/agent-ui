name: Version

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: true

permissions: {}

jobs:
  version:
    name: Version PR
    if: github.repository == 'kind-ui/agent-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Opens or updates a draft version PR while changesets are pending; it never publishes.
      # CI runs on the version PR once someone marks it ready for review.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          pr-draft: create
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

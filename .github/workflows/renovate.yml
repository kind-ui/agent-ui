name: Renovate

# Self-hosted Renovate, run as the kind-ui GitHub App. renovate.json limits it to @ui-sdk/* updates.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Look up updates without opening or changing anything.
        type: choice
        options: [none, lookup, full]
        default: none
      log-level:
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    if: github.repository == 'kind-ui/agent-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.KINDUI_BOT_APP_ID }}
          private-key: ${{ secrets.KINDUI_BOT_PRIVATE_KEY }}
          repositories: agent-ui
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.261.2
        env:
          RENOVATE_REPOSITORIES: kind-ui/agent-ui
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_GIT_AUTHOR: kind-ui[bot] <360918227+kind-ui[bot]@users.noreply.github.com>
          RENOVATE_DRY_RUN: ${{ inputs.dry-run != 'none' && inputs.dry-run || '' }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}

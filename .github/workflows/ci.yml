name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *" # nightly
    - cron: "41 8 * * 0" # weekly, repeating each browser test to surface flaky ones

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CROSS_BROWSER: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ci:cross-browser') }}

jobs:
  fast:
    name: Fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high --include=dev
      - run: npm run check:fast

  packed:
    name: Packed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The registry consumer check renders each consumer in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packed
          path: |
            artifacts/package/*.tgz
            artifacts/package/manifest.json
            artifacts/registry/consumer-evidence.json
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The docs check opens built pages in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run build:docs

  browser:
    name: Browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; the first parent is the base it diffs against.
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - id: specs
        name: Pick specs
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            specs=$(node scripts/affected-specs.mjs)
          else
            specs=all
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "Browser specs: ${specs:-none}"
      - if: steps.specs.outputs.specs != ''
        run: npx playwright install --with-deps chromium ${{ env.CROSS_BROWSER == 'true' && 'firefox webkit' || '' }}
      - if: steps.specs.outputs.specs != ''
        env:
          SPECS: ${{ steps.specs.outputs.specs != 'all' && steps.specs.outputs.specs || '' }}
          REPEAT: ${{ github.event.schedule == '41 8 * * 0' && '--repeat-each=3' || '' }}
        run: |
          # shellcheck disable=SC2086 # SPECS and REPEAT are lists of arguments.
          npm run test:browser -- --shard=${{ matrix.shard }}/4 --pass-with-no-tests $REPEAT $SPECS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: artifacts/test-results
          if-no-files-found: ignore

  all-checks:
    name: All checks
    if: always()
    needs: [fast, packed, docs, browser]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
